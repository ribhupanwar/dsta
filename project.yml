name: PulseForge
options:
  bundleIdPrefix: com.ribhupanwar
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    CODE_SIGNING_ALLOWED: "NO"
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "PulseForge uses GPS during an outdoor run to measure distance, pace and kilometre splits."
targets:
  PulseForge:
    type: application
    platform: iOS
    sources:
      - path: PulseForge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ribhupanwar.pulseforge
        PRODUCT_NAME: PulseForge
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "106"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: PulseForge
        INFOPLIST_KEY_NSHealthShareUsageDescription: "PulseForge reads your health data to show recovery, sleep, heart rate and training trends."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "PulseForge can save supported workout data to Apple Health when you choose."
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "PulseForge uses Bluetooth to connect to your WHOOP-compatible wearable."
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
    info:
      path: PulseForge/Info.plist
      properties:
        UIBackgroundModes:
          - bluetooth-central
          - location
    entitlements:
      path: PulseForge/PulseForge.entitlements
      properties:
        com.apple.developer.healthkit: true

  PulseForgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PulseForgeTests
    dependencies:
      - target: PulseForge
schemes:
  PulseForge:
    build:
      targets:
        PulseForge: all
    test:
      targets:
        - PulseForgeTests
