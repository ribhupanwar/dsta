name: WHOOP biological age and healthspan reverse-engineering audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-whoop-healthspan:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Download and verify pinned WHOOP 5.75.0 IPA
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/ribhupanwar/dsta/releases/download/whoop-5.75.0/pulseforge.ipa" \
            --output /tmp/whoop-original.ipa
          ACTUAL="$(shasum -a 256 /tmp/whoop-original.ipa | awk '{print $1}')"
          EXPECTED="8a5deedc59567612683feb77dd7348238de89437123946b3344bc6ff1e90af8a"
          echo "WHOOP IPA SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          unzip -tq /tmp/whoop-original.ipa
          mkdir -p biological-age-evidence
          unzip -q /tmp/whoop-original.ipa -d /tmp/whoop-ipa

      - name: Inventory model assets, frameworks and app metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, plistlib, zipfile
          from pathlib import Path
          out = Path("biological-age-evidence")
          terms = ("model", "healthspan", "biological", "longevity", "age", "wellness", "risk", "mortality", "lifespan", "pace", "fitness")
          model_ext = (".mlmodel", ".mlmodelc", ".mlpackage", ".onnx", ".tflite", ".pt", ".pth", ".coreml")
          with zipfile.ZipFile("/tmp/whoop-original.ipa") as z:
              names = z.namelist()
              selected = [n for n in names if n.lower().endswith(model_ext) or any(t in n.lower() for t in terms)]
              (out / "model-and-healthspan-paths.json").write_text(json.dumps(selected, indent=2))
              infos = [n for n in names if n.startswith("Payload/") and n.endswith(".app/Info.plist")]
              metadata = {}
              for n in infos:
                  p = plistlib.loads(z.read(n))
                  metadata[n] = {k:p.get(k) for k in ("CFBundleIdentifier","CFBundleShortVersionString","CFBundleVersion","CFBundleExecutable","UIBackgroundModes")}
              (out / "app-metadata.json").write_text(json.dumps(metadata, indent=2, default=str))
              (out / "all-bundle-paths.txt").write_text("\\n".join(sorted(names)))
          print(f"Bundle entries: {len(names)}; health/model path hits: {len(selected)}")
          PY

      - name: Extract broad healthspan, age and VO2 executable evidence
        shell: bash
        run: |
          set -euo pipefail
          INFO="$(find /tmp/whoop-ipa/Payload -maxdepth 2 -type f -name Info.plist -print -quit)"
          APP="$(dirname "$INFO")"
          BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO")"
          ARCHS="$(lipo -archs "$BIN")"
          if [[ "$ARCHS" == "arm64" ]]; then cp "$BIN" /tmp/whoop-arm64; else lipo "$BIN" -thin arm64 -output /tmp/whoop-arm64; fi
          strings -a /tmp/whoop-arm64 > biological-age-evidence/all-binary-strings.txt
          nm -arch arm64 -nm /tmp/whoop-arm64 > biological-age-evidence/all-nm-symbols.txt 2>&1 || true
          xcrun swift-demangle < <(awk '{print $NF}' biological-age-evidence/all-nm-symbols.txt | grep '^_' | sort -u) > biological-age-evidence/all-swift-demangled-symbols.txt 2>&1 || true
          PATTERN='biological.?age|health.?span|healthspan|longevity|life.?span|aging.?clock|age.?score|fitness.?age|cardio.?age|metabolic.?age|mortality|morbidity|epigenetic|phenotypic.?age|wear.?and.?tear|vo.?2|maximal.?oxygen|cardio.?fitness|aerobic.?fitness|resting.?heart|heart.?rate.?variability|respiratory.?rate|sleep.?consistency|strain.?score'
          grep -Ein "$PATTERN" biological-age-evidence/all-binary-strings.txt > biological-age-evidence/healthspan-string-hits.txt || true
          grep -Ein "$PATTERN" biological-age-evidence/all-swift-demangled-symbols.txt > biological-age-evidence/healthspan-swift-symbol-hits.txt || true
          grep -Ein 'HealthKit|HKQuantityTypeIdentifier|CoreML|MLModel|URLSession|progression-service|trends|score_timestamp|vo2max_score|biological|healthspan|longevity' biological-age-evidence/all-binary-strings.txt > biological-age-evidence/data-flow-and-service-hits.txt || true

      - name: Inspect relevant disassembly references
        shell: bash
        run: |
          set -euo pipefail
          otool -arch arm64 -tvV /tmp/whoop-arm64 > /tmp/whoop-full-disassembly.txt 2>biological-age-evidence/disassembly-errors.txt || true
          python3 - <<'PY'
          import re
          from pathlib import Path
          lines = Path("/tmp/whoop-full-disassembly.txt").read_text(errors="replace").splitlines()
          pattern = re.compile(r"biological.?age|health.?span|healthspan|longevity|life.?span|aging.?clock|age.?score|fitness.?age|cardio.?age|metabolic.?age|mortality|epigenetic|phenotypic.?age|vo.?2|maximal.?oxygen|cardio.?fitness", re.I)
          hits = [i for i, line in enumerate(lines) if pattern.search(line)]
          keep = set()
          for i in hits:
              keep.update(range(max(0, i-25), min(len(lines), i+50)))
          Path("biological-age-evidence/disassembly-context.txt").write_text("\\n".join(lines[i] for i in sorted(keep)))
          Path("biological-age-evidence/disassembly-match-index.txt").write_text("\\n".join(f"{i+1}: {lines[i]}" for i in hits))
          print(f"Disassembly lines: {len(lines)}; matched instructions: {len(hits)}")
          PY

      - name: Upload biological age evidence
        uses: actions/upload-artifact@v4
        with:
          name: whoop-original-ipa-biological-age-evidence
          path: biological-age-evidence/
          if-no-files-found: error
          retention-days: 14
