name: Inspect WHOOP archive metadata

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download release IPA directly on runner
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/ribhupanwar/dsta/releases/download/whoop-5.75.0/pulseforge.ipa" \
            --output /tmp/release-app.ipa
          echo "Downloaded bytes: $(stat -c%s /tmp/release-app.ipa)"
          echo "Downloaded SHA-256:"
          sha256sum /tmp/release-app.ipa
          unzip -tq /tmp/release-app.ipa

      - name: Inspect IPA identity and public metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, hashlib, os, plistlib, subprocess, zipfile
          ipa = "/tmp/release-app.ipa"
          report = []
          with zipfile.ZipFile(ipa) as z:
              names = z.namelist()
              apps = sorted({n.split("/")[1] for n in names if n.startswith("Payload/") and n.count("/") >= 2 and n.endswith(".app/")})
              info_paths = [n for n in names if n.startswith("Payload/") and n.endswith(".app/Info.plist")]
              report += ["IPA SHA256: " + hashlib.sha256(open(ipa,"rb").read()).hexdigest(),
                         "Archive entries: " + str(len(names)),
                         "App bundles: " + ", ".join(apps)]
              for path in info_paths:
                  p = plistlib.loads(z.read(path))
                  report += ["", "Bundle path: " + path,
                             "CFBundleIdentifier: " + str(p.get("CFBundleIdentifier")),
                             "CFBundleName: " + str(p.get("CFBundleName")),
                             "CFBundleDisplayName: " + str(p.get("CFBundleDisplayName")),
                             "CFBundleShortVersionString: " + str(p.get("CFBundleShortVersionString")),
                             "CFBundleVersion: " + str(p.get("CFBundleVersion")),
                             "Executable: " + str(p.get("CFBundleExecutable")),
                             "MinimumOSVersion: " + str(p.get("MinimumOSVersion"))]
              frameworks = sorted({n.split("/Frameworks/")[1].split("/")[0] for n in names if "/Frameworks/" in n})
              report += ["", "Embedded frameworks:", *(frameworks or ["(none found)"])]
              report += ["", "Relevant archive paths:"]
              report += [n for n in names if any(k in n.lower() for k in ("privacyinfo", "healthkit", "bluetooth", "hellopacket", "hrbroadcast"))][:150]
              executable_paths = []
              for path in info_paths:
                  p = plistlib.loads(z.read(path))
                  exe = p.get("CFBundleExecutable")
                  if exe:
                      candidate = path.rsplit("/",1)[0] + "/" + exe
                      if candidate in names: executable_paths.append(candidate)
              for exe in executable_paths:
                  data = z.read(exe)
                  out = subprocess.run(["strings","-a"], input=data, stdout=subprocess.PIPE, check=True).stdout.decode("utf-8","ignore")
                  needles = ("FD4B", "180D", "2A37", "HealthKit", "HKHealthStore", "Recovery", "Sleep", "Strain", "WHOOP")
                  found = sorted({line.strip() for line in out.splitlines() if any(n.lower() in line.lower() for n in needles)})
                  report += ["", "Executable scan: " + exe, *found[:250]]
          os.makedirs("comparison-report", exist_ok=True)
          open("comparison-report/release-ipa-inspection.txt","w").write("\n".join(report)+"\n")
          print("\n".join(report))
          PY

      - name: Compare source implementation inventory
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "=== PulseForge implementation inventory ==="
            find PulseForge PulseForgeTests -type f 2>/dev/null | sort
            echo
            echo "=== Relevant implementation symbols ==="
            grep -RniE 'RecoveryScoreCalculator|SleepNightCalculator|HKHealthStore|CBCentralManager|CBPeripheral|FD4B|heartRate|sleepDebt|strain' PulseForge 2>/dev/null | head -300 || true
          } > comparison-report/pulseforge-source-inventory.txt
          cat comparison-report/pulseforge-source-inventory.txt

      - name: Upload comparison evidence
        uses: actions/upload-artifact@v4
        with:
          name: ipa-comparison-evidence
          path: comparison-report/
          retention-days: 14
