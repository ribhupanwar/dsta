name: PulseForge iOS CI

on:
  push:
    branches:
      - main
      - whoop-background-ble
  workflow_dispatch:

concurrency:
  group: pulseforge-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Discover, build and test iOS app
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check whether this branch contains the iOS project
        id: source
        shell: bash
        run: |
          mkdir -p ci-logs
          if [[ -f project.yml ]] || compgen -G "*.xcodeproj" > /dev/null || compgen -G "*.xcworkspace" > /dev/null; then
            echo "has_project=true" >> "$GITHUB_OUTPUT"
            echo "iOS project source detected." | tee ci-logs/source-check.log
          else
            echo "has_project=false" >> "$GITHUB_OUTPUT"
            echo "Build skipped: this branch does not contain project.yml, .xcodeproj, or .xcworkspace. The iOS app source is currently maintained on whoop-background-ble." | tee ci-logs/source-check.log
            {
              echo "## iOS build skipped"
              echo "This branch has no Xcode project/workspace or project.yml. No compile was attempted."
              echo "The app source is currently on whoop-background-ble."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install XcodeGen when needed
        if: steps.source.outputs.has_project == 'true'
        shell: bash
        run: |
          if [[ -f project.yml ]] && ! compgen -G "*.xcodeproj" > /dev/null && ! compgen -G "*.xcworkspace" > /dev/null; then
            brew install xcodegen
            xcodegen generate
          fi

      - name: Discover project, workspace, scheme and test targets
        if: steps.source.outputs.has_project == 'true'
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G "*.xcworkspace" > /dev/null; then
            CONTAINER="$(find . -maxdepth 2 -type d -name '*.xcworkspace' -print -quit)"
            CONTAINER_FLAG="-workspace"
            BASE="${CONTAINER##*/}"
            BASE="${BASE%.xcworkspace}"
          elif compgen -G "*.xcodeproj" > /dev/null; then
            CONTAINER="$(find . -maxdepth 2 -type d -name '*.xcodeproj' -print -quit)"
            CONTAINER_FLAG="-project"
            BASE="${CONTAINER##*/}"
            BASE="${BASE%.xcodeproj}"
          else
            echo "::error::No .xcworkspace or .xcodeproj found in the repository."
            exit 1
          fi

          xcodebuild -list -json "$CONTAINER_FLAG" "$CONTAINER" > ci-xcode-list.json
          SCHEME="$(python3 - "$BASE" ci-xcode-list.json <<'PY'
          import json, sys
          base, path = sys.argv[1:]
          with open(path) as f:
              data = json.load(f)
          container_data = data.get("workspace") or data.get("project") or {}
          schemes = container_data.get("schemes", [])
          if not schemes:
              raise SystemExit("No Xcode schemes were discovered.")
          print(base if base in schemes else schemes[0])
          PY
          )"
          HAS_TESTS="$(python3 - "$CONTAINER" "$CONTAINER_FLAG" ci-xcode-list.json <<'PY'
          import glob, json, os, subprocess, sys
          container, flag, listing = sys.argv[1:]
          with open(listing) as f:
              data = json.load(f)
          targets = list(data.get("project", {}).get("targets", []))
          # Workspace listings expose projects rather than target names. Inspect
          # each project inside the workspace so test targets are not missed.
          if flag == "-workspace":
              for project in glob.glob("**/*.xcodeproj", recursive=True):
                  try:
                      result = subprocess.run(
                          ["xcodebuild", "-list", "-json", "-project", project],
                          check=True, capture_output=True, text=True
                      )
                      project_data = json.loads(result.stdout)
                      targets.extend(project_data.get("project", {}).get("targets", []))
                  except (subprocess.CalledProcessError, json.JSONDecodeError):
                      continue
          print("true" if any("test" in name.lower() for name in targets) else "false")
          PY
          )"

          echo "container=$CONTAINER" >> "$GITHUB_OUTPUT"
          echo "container_flag=$CONTAINER_FLAG" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "has_tests=$HAS_TESTS" >> "$GITHUB_OUTPUT"
          {
            echo "## Xcode project discovery"
            echo "- Container: $CONTAINER"
            echo "- Scheme: $SCHEME"
            echo "- Unit-test target detected: $HAS_TESTS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build for iOS Simulator and run available unit tests
        if: steps.source.outputs.has_project == 'true'
        shell: bash
        env:
          CONTAINER: ${{ steps.discover.outputs.container }}
          CONTAINER_FLAG: ${{ steps.discover.outputs.container_flag }}
          SCHEME: ${{ steps.discover.outputs.scheme }}
          HAS_TESTS: ${{ steps.discover.outputs.has_tests }}
        run: |
          set -uo pipefail
          mkdir -p ci-logs
          BUILD_LOG="ci-logs/build.log"
          TEST_LOG="ci-logs/tests.log"

          run_xcodebuild() {
            local label="$1"
            local logfile="$2"
            shift 2
            echo "### $label" >> "$GITHUB_STEP_SUMMARY"
            set +e
            xcodebuild "$@" 2>&1 | tee "$logfile"
            local status=${PIPESTATUS[0]}
            set -e
            if [[ $status -ne 0 ]]; then
              {
                echo
                echo "$label failed (exit $status). First compiler/build errors:"
                echo '---'
                grep -E -m 20 'error:|fatal error:|BUILD FAILED|TEST FAILED' "$logfile" || tail -n 80 "$logfile"
                echo '---'
              } >> "$GITHUB_STEP_SUMMARY"
              return "$status"
            fi
            echo "- $label: passed" >> "$GITHUB_STEP_SUMMARY"
          }

          COMMON=("$CONTAINER_FLAG" "$CONTAINER" -scheme "$SCHEME" -destination "generic/platform=iOS Simulator" -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO)
          run_xcodebuild "Simulator build" "$BUILD_LOG" "${COMMON[@]}" build || exit $?

          if [[ "$HAS_TESTS" == "true" ]]; then
            # xcodebuild test requires a concrete simulator, unlike the generic
            # destination used for compile-only validation.
            TEST_DESTINATION="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          devices = [device for runtime in data.get("devices", {}).values() for device in runtime]
          match = next((d for d in devices if d.get("isAvailable") and d.get("name", "").startswith("iPhone")), None)
          if match is None:
              raise SystemExit("No available iPhone Simulator device was found.")
          print("platform=iOS Simulator,id=" + match["udid"])
          ')"
            echo "- Test simulator: $TEST_DESTINATION" >> "$GITHUB_STEP_SUMMARY"
            TEST_COMMON=("$CONTAINER_FLAG" "$CONTAINER" -scheme "$SCHEME" -destination "$TEST_DESTINATION" -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO)
            run_xcodebuild "Unit tests" "$TEST_LOG" "${TEST_COMMON[@]}" test || exit $?
          else
            echo "- Unit tests: skipped — no test target exists in the discovered Xcode project." >> "$GITHUB_STEP_SUMMARY"
            echo "No test target detected; build remains successful." > "$TEST_LOG"
          fi

      - name: Build unsigned iOS device app and package IPA
        if: steps.source.outputs.has_project == 'true'
        shell: bash
        env:
          CONTAINER: ${{ steps.discover.outputs.container }}
          CONTAINER_FLAG: ${{ steps.discover.outputs.container_flag }}
          SCHEME: ${{ steps.discover.outputs.scheme }}
        run: |
          set -euo pipefail
          DEVICE_LOG="ci-logs/device-build.log"
          xcodebuild "$CONTAINER_FLAG" "$CONTAINER" \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$DEVICE_LOG"
          APP_PATH="build/Build/Products/Release-iphoneos/PulseForge.app"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "::error::Device .app not found at $APP_PATH"
            exit 1
          fi
          mkdir -p ipa-staging/Payload
          cp -R "$APP_PATH" ipa-staging/Payload/PulseForge.app
          (cd ipa-staging && /usr/bin/zip -qry ../PulseForge-unsigned.ipa Payload)
          echo "Unsigned device IPA packaged. It must be signed with a valid provisioning profile before installation." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned iOS IPA
        if: success() && steps.source.outputs.has_project == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pulseforge-unsigned-ipa
          path: PulseForge-unsigned.ipa
          if-no-files-found: error
          retention-days: 14


      - name: Upload full Xcode logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulseforge-xcode-logs
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 14
