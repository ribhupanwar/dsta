name: WHOOP IPA Mach-O protocol symbol audit

on:
  workflow_dispatch:
  push:
    branches: [main, feature/export-whoop-rr-raw-archive]
    paths:
      - ".github/workflows/whoop-ipa-mach-o-audit.yml"

permissions:
  contents: read

jobs:
  inspect-mach-o:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Download pinned WHOOP 5.75.0 IPA
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/ribhupanwar/dsta/releases/download/whoop-5.75.0/pulseforge.ipa" \
            --output /tmp/whoop-original.ipa
          shasum -a 256 /tmp/whoop-original.ipa
          unzip -tq /tmp/whoop-original.ipa

      - name: Extract arm64 Mach-O symbols and targeted disassembly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mach-o-evidence
          unzip -q /tmp/whoop-original.ipa -d /tmp/whoop-ipa
          APP_INFO="$(find /tmp/whoop-ipa/Payload -maxdepth 2 -name Info.plist -print -quit)"
          APP_DIR="$(dirname "$APP_INFO")"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_INFO")"
          BIN="$APP_DIR/$EXECUTABLE"
          test -f "$BIN"
          echo "App: $APP_DIR" > mach-o-evidence/README.txt
          echo "Executable: $BIN" >> mach-o-evidence/README.txt
          echo "IPA SHA-256: $(shasum -a 256 /tmp/whoop-original.ipa | awk '{print $1}')" >> mach-o-evidence/README.txt
          echo "Binary SHA-256: $(shasum -a 256 "$BIN" | awk '{print $1}')" >> mach-o-evidence/README.txt
          ARCHS="$(lipo -archs "$BIN")"
          echo "Architectures: $ARCHS" >> mach-o-evidence/README.txt
          if [[ "$ARCHS" == "arm64" ]]; then
            cp "$BIN" /tmp/whoop-arm64
          else
            lipo "$BIN" -thin arm64 -output /tmp/whoop-arm64
          fi
          nm -arch arm64 -nm /tmp/whoop-arm64 > mach-o-evidence/nm-arm64.txt 2>&1 || true
          xcrun swift-demangle < <(awk '{print $NF}' mach-o-evidence/nm-arm64.txt | grep '^_' | sort -u) \
            > mach-o-evidence/swift-demangled-symbols.txt 2>&1 || true
          grep -Ei 'Hello(Packet|Response|Sending|Info)|sendGetHelloPacket|RealtimeHRPacket|RealtimeSequenceable|HistoricalSequenceable|FrameEnvelopePacket|RevisionRouter|RealtimeHeartRateData|HistoricalPull|WhoopPacket.*CRC|rrIntervals|RealtimeDataType' \
            mach-o-evidence/swift-demangled-symbols.txt > mach-o-evidence/protocol-symbols.txt || true
          grep -Ei 'step.?count|stepcounter|pedometer|CMPedometer|CMAltimeter|HKQuantityTypeIdentifier|walking|stride|cadence|processed.?steps|steps.?packet|historical.*steps|R24|accelerometer|gyroscope|IMUStream|RealtimeIMU|HistoricalIMU|IMUPacket|ActivityDetection|Motion' \
            mach-o-evidence/swift-demangled-symbols.txt > mach-o-evidence/step-motion-symbols.txt || true
          strings -a /tmp/whoop-arm64 | grep -Ei 'HelloPacketRev[34]|sendGetHelloPacket|HelloResponsePacket|RealtimeHRPacket|HistoricalSequenceable|rrIntervals|FD4B|Characteristics Subscribed|HELLO RESPONSE' \
            > mach-o-evidence/protocol-strings.txt || true
          strings -a /tmp/whoop-arm64 | grep -Ei 'step.?count|stepcounter|pedometer|CMPedometer|CMAltimeter|HKQuantityTypeIdentifierStepCount|walking|stride|cadence|accelerometer|gyroscope|IMUStream|RealtimeIMU|HistoricalIMU|IMUPacket|ActivityDetection|Motion|/.*step|ProcessedSteps|HistoricalProcessedSteps|StepsPacket|R24' \
            | sort -u > mach-o-evidence/step-motion-strings.txt || true
          otool -arch arm64 -l /tmp/whoop-arm64 > mach-o-evidence/load-commands.txt
          otool -arch arm64 -tvV /tmp/whoop-arm64 > /tmp/whoop-disassembly.txt 2>mach-o-evidence/otool-errors.txt || true
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path("/tmp/whoop-disassembly.txt").read_text(errors="replace")
          lines = source.splitlines()
          terms = re.compile(r"hello|realtimehr|historical|frameenvelope|revisionrouter|rrinterval|sendgethellopacket|crc|step.?count|stepcounter|pedometer|CMPedometer|HKQuantityTypeIdentifier|processed.?steps|steps.?packet|HistoricalProcessedSteps|StepsPacket|R24|accelerometer|gyroscope|IMUStream|RealtimeIMU|IMUPacket|ActivityDetection|stride|cadence|motion", re.I)
          hits = [i for i, line in enumerate(lines) if terms.search(line)]
          keep = set()
          for i in hits:
              keep.update(range(max(0, i-18), min(len(lines), i+45)))
          selected = sorted(keep)
          out = []
          previous = -2
          for i in selected:
              if i != previous + 1:
                  out.append("\n--- disassembly context ---")
              out.append(lines[i])
              previous = i
          Path("mach-o-evidence/protocol-disassembly-context.txt").write_text("\n".join(out) + "\n")
          print(f"Disassembly lines: {len(lines)}; matching context lines: {len(selected)}")
          Path("mach-o-evidence/step-motion-disassembly-context.txt").write_text("\n".join(out) + "\n")
          PY
          echo "Targeted Swift symbols and disassembly context are static evidence only; they do not prove runtime BLE behaviour." >> mach-o-evidence/README.txt
          echo "No protocol payloads were modified or sent." >> mach-o-evidence/README.txt

      - name: Resolve step-count metadata cross-references
        shell: bash
        run: |
          set -euo pipefail
          brew install radare2
          r2 -q -c 'izzj' /tmp/whoop-arm64 > /tmp/whoop-strings.json 2>mach-o-evidence/radare2-strings-errors.txt
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          binary = "/tmp/whoop-arm64"
          terms = re.compile(r"currentStepCount|lastStepCount|previousStepCount|delayedStepCountProcessingWorkItem|HealthKitStepCountRequest|HealthKitStepCountSubmissionDTO|step_count_samples|deleted_step_count_samples|HKQuantityTypeIdentifier|CMPedometer|pedometer|ProcessedSteps|HistoricalProcessedSteps|StepsPacket|step.?count|steps.?packet|R24|IMUPacket|RealtimeIMUData", re.I)
          raw = Path("/tmp/whoop-strings.json").read_text(errors="replace").strip()
          data = json.loads(raw)
          entries = data if isinstance(data, list) else data.get("strings", [])
          hits = []
          for item in entries:
              value = str(item.get("string", item.get("name", "")))
              if not terms.search(value):
                  continue
              addr = item.get("vaddr", item.get("paddr", item.get("offset")))
              if addr is None:
                  continue
              address = int(addr, 0) if isinstance(addr, str) else int(addr)
              hits.append((address, value))
          # Keep the audit bounded: the stripped WHOOP binary contains many unrelated
          # matches, and spawning radare2 once per match can exceed the whole job timeout.
          hits.sort(key=lambda item: (0 if re.search(r"currentStepCount|lastStepCount|previousStepCount|HealthKitStepCount|step_count_samples|HKQuantityTypeIdentifierStepCount", item[1], re.I) else 1, item[0]))
          hits = hits[:24]
          locations = ["# WHOOP step-count string locations (radare2 JSON virtual addresses)", "Static analysis only; bounded to 24 high-priority matches."]
          for address, value in hits:
              locations.append(f"0x{address:x}  {value}")
          Path("mach-o-evidence/step-count-string-locations.txt").write_text("\n".join(locations) + "\n")
          xrefs = []
          functions = set()
          for address, value in hits:
              try:
                  cmd = subprocess.run(["r2", "-q", "-e", "bin.relocs.apply=true", "-A", "-c", f"axtj @ 0x{address:x}", binary], text=True, capture_output=True, timeout=30)
                  try:
                      refs = json.loads(cmd.stdout.strip() or "[]")
                  except json.JSONDecodeError:
                      refs = []
                  status = "xref scan completed with relocation application and analysis enabled"
              except subprocess.TimeoutExpired:
                  refs = []
                  status = "xref scan timed out after 30 seconds; continuing with remaining strings"
              xrefs.append(f"## 0x{address:x} {value}\n{status}\n{json.dumps(refs, indent=2)}")
              for ref in refs if isinstance(refs, list) else []:
                  origin = ref.get("from") or ref.get("fcn_addr")
                  if origin is not None:
                      functions.add(int(origin, 0) if isinstance(origin, str) else int(origin))
          selected_functions = sorted(functions)[:12]
          disasm = []
          for address in selected_functions:
              try:
                  cmd = subprocess.run(["r2", "-q", "-A", "-c", f"pdf @ 0x{address:x}", binary], text=True, capture_output=True, timeout=25)
                  output = cmd.stdout[:20000]
              except subprocess.TimeoutExpired:
                  output = "Timed out after 25 seconds; function omitted from detailed disassembly."
              disasm.append(f"## Referencing function near 0x{address:x}\n{output}")
          Path("mach-o-evidence/step-count-xrefs.txt").write_text("\n".join(xrefs) or "No matching strings with virtual addresses found.\n")
          Path("mach-o-evidence/step-count-xref-functions.txt").write_text("\n".join(disasm) or "No referencing functions resolved.\n")
          print(f"Matching strings analyzed: {len(hits)}; xref source addresses: {len(functions)}; functions disassembled: {len(selected_functions)}")
          PY
      - name: Upload Mach-O evidence
        uses: actions/upload-artifact@v4
        with:
          name: whoop-ipa-mach-o-protocol-audit
          path: mach-o-evidence/
          retention-days: 14
