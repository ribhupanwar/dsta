name: WHOOP IPA Mach-O protocol symbol audit

on:
  workflow_dispatch:
  push:
    branches: [main, feature/export-whoop-rr-raw-archive, audit/whoop-r24-step-counter-dispatch]
    paths:
      - ".github/workflows/whoop-ipa-mach-o-audit.yml"

permissions:
  contents: read

jobs:
  inspect-mach-o:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Download pinned WHOOP 5.75.0 IPA
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/ribhupanwar/dsta/releases/download/whoop-5.75.0/pulseforge.ipa" \
            --output /tmp/whoop-original.ipa
          shasum -a 256 /tmp/whoop-original.ipa
          unzip -tq /tmp/whoop-original.ipa

      - name: Extract arm64 Mach-O symbols and targeted disassembly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mach-o-evidence
          unzip -q /tmp/whoop-original.ipa -d /tmp/whoop-ipa
          APP_INFO="$(find /tmp/whoop-ipa/Payload -maxdepth 2 -name Info.plist -print -quit)"
          APP_DIR="$(dirname "$APP_INFO")"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_INFO")"
          BIN="$APP_DIR/$EXECUTABLE"
          test -f "$BIN"
          echo "App: $APP_DIR" > mach-o-evidence/README.txt
          echo "Executable: $BIN" >> mach-o-evidence/README.txt
          echo "IPA SHA-256: $(shasum -a 256 /tmp/whoop-original.ipa | awk '{print $1}')" >> mach-o-evidence/README.txt
          echo "Binary SHA-256: $(shasum -a 256 "$BIN" | awk '{print $1}')" >> mach-o-evidence/README.txt
          ARCHS="$(lipo -archs "$BIN")"
          echo "Architectures: $ARCHS" >> mach-o-evidence/README.txt
          if [[ "$ARCHS" == "arm64" ]]; then
            cp "$BIN" /tmp/whoop-arm64
          else
            lipo "$BIN" -thin arm64 -output /tmp/whoop-arm64
          fi
          nm -arch arm64 -nm /tmp/whoop-arm64 > mach-o-evidence/nm-arm64.txt 2>&1 || true
          xcrun swift-demangle < <(awk '{print $NF}' mach-o-evidence/nm-arm64.txt | grep '^_' | sort -u) \
            > mach-o-evidence/swift-demangled-symbols.txt 2>&1 || true
          if REFLECTION_TOOL="$(xcrun --find swift-reflection-dump 2>/dev/null)"; then
            "$REFLECTION_TOOL" --binary-filename /tmp/whoop-arm64 --arch arm64 \
              > mach-o-evidence/swift-reflection.txt 2>mach-o-evidence/swift-reflection-errors.txt || true
          else
            echo "swift-reflection-dump unavailable in this Xcode image" > mach-o-evidence/swift-reflection.txt
          fi
          grep -Ei 'Hello(Packet|Response|Sending|Info)|sendGetHelloPacket|RealtimeHRPacket|RealtimeSequenceable|HistoricalSequenceable|FrameEnvelopePacket|RevisionRouter|RealtimeHeartRateData|HistoricalPull|WhoopPacket.*CRC|rrIntervals|RealtimeDataType' \
            mach-o-evidence/swift-demangled-symbols.txt > mach-o-evidence/protocol-symbols.txt || true
          grep -Ei 'step.?count|stepcounter|pedometer|CMPedometer|CMAltimeter|HKQuantityTypeIdentifier|walking|stride|cadence|processed.?steps|steps.?packet|historical.*steps|R24|accelerometer|gyroscope|IMUStream|RealtimeIMU|HistoricalIMU|IMUPacket|ActivityDetection|Motion' \
            mach-o-evidence/swift-demangled-symbols.txt > mach-o-evidence/step-motion-symbols.txt || true
          strings -a /tmp/whoop-arm64 | grep -Ei 'HelloPacketRev[34]|sendGetHelloPacket|HelloResponsePacket|RealtimeHRPacket|HistoricalSequenceable|rrIntervals|FD4B|Characteristics Subscribed|HELLO RESPONSE' \
            > mach-o-evidence/protocol-strings.txt || true
          strings -a /tmp/whoop-arm64 | grep -Ei 'step.?count|stepcounter|pedometer|CMPedometer|CMAltimeter|HKQuantityTypeIdentifierStepCount|walking|stride|cadence|accelerometer|gyroscope|IMUStream|RealtimeIMU|HistoricalIMU|IMUPacket|ActivityDetection|Motion|/.*step|ProcessedSteps|HistoricalProcessedSteps|StepsPacket|R24' \
            | sort -u > mach-o-evidence/step-motion-strings.txt || true
          otool -arch arm64 -l /tmp/whoop-arm64 > mach-o-evidence/load-commands.txt
          OBJDUMP="$(xcrun --find llvm-objdump)"
          "$OBJDUMP" --help > mach-o-evidence/llvm-objdump-help.txt
          grep -q -- '--start-address' mach-o-evidence/llvm-objdump-help.txt
          : > /tmp/whoop-disassembly.txt
          for RANGE in "0x10036d000:0x100370000" "0x100802000:0x100804000" "0x10088e000:0x100892000" "0x105ce7000:0x105ce9000" "0x105cf6000:0x105cf7000"; do
            START="${RANGE%%:*}"
            STOP="${RANGE##*:}"
            echo "### RANGE ${START} ${STOP}" >> /tmp/whoop-disassembly.txt
            "$OBJDUMP" --arch=arm64 --disassemble --no-show-raw-insn --start-address="${START}" --stop-address="${STOP}" /tmp/whoop-arm64 >> /tmp/whoop-disassembly.txt 2>>mach-o-evidence/otool-errors.txt
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path("/tmp/whoop-disassembly.txt").read_text(errors="replace")
          lines = source.splitlines()
          terms = re.compile(r"hello|realtimehr|historical|frameenvelope|revisionrouter|rrinterval|sendgethellopacket|crc|step.?count|stepcounter|pedometer|CMPedometer|HKQuantityTypeIdentifier|processed.?steps|steps.?packet|HistoricalProcessedSteps|StepsPacket|R24|accelerometer|gyroscope|IMUStream|RealtimeIMU|IMUPacket|ActivityDetection|stride|cadence|motion", re.I)
          hits = [i for i, line in enumerate(lines) if terms.search(line)]
          keep = set()
          for i in hits:
              keep.update(range(max(0, i-18), min(len(lines), i+45)))
          selected = sorted(keep)
          out = []
          previous = -2
          for i in selected:
              if i != previous + 1:
                  out.append("\n--- disassembly context ---")
              out.append(lines[i])
              previous = i
          Path("mach-o-evidence/protocol-disassembly-context.txt").write_text("\n".join(out) + "\n")
          print(f"Disassembly lines: {len(lines)}; matching context lines: {len(selected)}")
          Path("mach-o-evidence/step-motion-disassembly-context.txt").write_text("\n".join(out) + "\n")
          PY
          echo "Targeted Swift symbols and disassembly context are static evidence only; they do not prove runtime BLE behaviour." >> mach-o-evidence/README.txt
          echo "No protocol payloads were modified or sent." >> mach-o-evidence/README.txt

      - name: Resolve WHOOP R24 and step-count references from ARM64 disassembly
        shell: bash
        run: |
          set -euo pipefail
          brew install radare2
          r2 -q -c 'izzj' /tmp/whoop-arm64 > /tmp/whoop-strings.json 2>mach-o-evidence/radare2-strings-errors.txt
          r2 -q -c 'pxj 256 @ 0x108acfdee' /tmp/whoop-arm64 > /tmp/r24-jump-table.json 2>mach-o-evidence/r24-jump-table-errors.txt || echo '[]' > /tmp/r24-jump-table.json
          r2 -q -c 'pxj 256 @ 0x108ebdb70' /tmp/whoop-arm64 > /tmp/historical-r24-jump-table.json 2>mach-o-evidence/historical-r24-jump-table-errors.txt || echo '[]' > /tmp/historical-r24-jump-table.json
          r2 -q -c 'pxj 512 @ 0x108add8f0' /tmp/whoop-arm64 > /tmp/imu-packet-jump-table.json 2>mach-o-evidence/imu-packet-jump-table-errors.txt || echo '[]' > /tmp/imu-packet-jump-table.json
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          terms = re.compile(
              r"Historical Processed Steps Packet \(R24\)|Processed Steps Data \(R24\)|"
              r"R24q|currentStepCount|lastStepCount|previousStepCount|delayedStepCountProcessingWorkItem|"
              r"HealthKitStepCountRequest|HealthKitStepCountSubmissionDTO|step_count_samples|"
              r"deleted_step_count_samples|HKQuantityTypeIdentifierStepCount|IMUPacket|RealtimeIMUData",
              re.I,
          )
          raw = Path("/tmp/whoop-strings.json").read_text(errors="replace").strip()
          data = json.loads(raw)
          entries = data if isinstance(data, list) else data.get("strings", [])
          hits = []
          for item in entries:
              value = str(item.get("string", item.get("name", "")))
              if not terms.search(value):
                  continue
              addr = item.get("vaddr", item.get("paddr", item.get("offset")))
              if addr is None:
                  continue
              address = int(addr, 0) if isinstance(addr, str) else int(addr)
              hits.append((address, value))

          def priority(item):
              value = item[1]
              if "Historical Processed Steps Packet (R24)" in value: return 0
              if "Processed Steps Data (R24)" in value: return 1
              if value == "R24q": return 2
              if "IMUPacket" in value: return 3
              if "RealtimeIMUData" in value: return 4
              if "HealthKitStepCount" in value: return 5
              if value == "step_count_samples": return 6
              if value == "deleted_step_count_samples": return 7
              return 8

          hits = sorted(set(hits), key=lambda item: (priority(item), item[0]))[:120]
          locations = [
              "# WHOOP step/R24 string locations (Mach-O virtual addresses)",
              "Static analysis only; prioritized R24, IMU, and HealthKit step-count strings.",
          ]
          for address, value in hits:
              locations.append(f"0x{address:x}  {value}")
          Path("mach-o-evidence/step-count-string-locations.txt").write_text("\n".join(locations) + "\n")

          # Resolve direct ARM64 ADRP + ADD references without whole-binary
          # function analysis. The full otool disassembly was generated above.
          by_page = {}
          for address, value in hits:
              by_page.setdefault(address & ~0xfff, []).append((address, value))
          lines = Path("/tmp/whoop-disassembly.txt").read_text(errors="replace").splitlines()
          adrp_re = re.compile(r"^\s*([0-9a-f]+)\s+adrp\s+(x\d+),.*?;\s*0x([0-9a-f]+)", re.I)
          add_re = re.compile(r"^\s*([0-9a-f]+)\s+add\s+(x\d+),\s*(x\d+),\s*#0x([0-9a-f]+)", re.I)
          refs = []
          for i, line in enumerate(lines):
              m = adrp_re.match(line)
              if not m:
                  continue
              register = m.group(2)
              page = int(m.group(3), 16)
              page_targets = by_page.get(page)
              if not page_targets:
                  continue
              for j in range(i + 1, min(i + 9, len(lines))):
                  a = add_re.match(lines[j])
                  if not a or a.group(2) != register or a.group(3) != register:
                      continue
                  low = int(a.group(4), 16)
                  for address, value in page_targets:
                      if (address & 0xfff) == low:
                          refs.append((i, j, address, value, register))

          refs.sort(key=lambda x: (priority((x[2], x[3])), x[0]))
          xref_lines = [
              "# Direct ARM64 string references",
              "A reference is an ADRP page load followed by ADD of the exact string low-12-bit offset.",
              "No whole-program function analysis or runtime behaviour is implied.",
          ]
          for i, j, address, value, register in refs:
              xref_lines.append(
                  f"\n## 0x{address:x} {value} · instruction 0x{lines[i].split()[0]} · register {register}\n"
                  f"{lines[i].strip()}\n{lines[j].strip()}"
              )
          if not refs:
              xref_lines.append("No direct ADRP+ADD references matched the selected strings.")
          Path("mach-o-evidence/step-count-xrefs.txt").write_text("\n".join(xref_lines) + "\n")

          context_indices = set()
          for i, j, address, value, register in refs:
              context_indices.update(range(max(0, i - 35), min(len(lines), j + 90)))
          context = []
          previous = -2
          for i in sorted(context_indices):
              if i != previous + 1:
                  context.append("\n--- reference-site context ---")
              context.append(lines[i])
              previous = i
          Path("mach-o-evidence/step-count-xref-functions.txt").write_text(
              "\n".join(context) if context else "No reference-site context resolved.\n"
          )

          # The R24 case in the observed switch is branch target 0x100802748;
          # the table base is 0x10080273c, so its byte value is 3.
          try:
              table_raw = json.loads(Path("/tmp/r24-jump-table.json").read_text())
              if isinstance(table_raw, dict):
                  table = table_raw.get("bytes", table_raw.get("data", []))
              else:
                  table = table_raw
              table = [int(value) for value in table if isinstance(value, (int, float))]
              indexes = [i for i, value in enumerate(table) if value == 3]
              table_text = [
                  "# WHOOP R24 enum switch table at 0x108acfdee",
                  f"Bytes recovered: {len(table)}",
                  "Observed R24 branch delta: (0x100802748 - 0x10080273c) / 4 = 3",
                  "Input-byte indexes selecting that branch: " + (", ".join(map(str, indexes)) if indexes else "none found"),
                  "Table hex: " + " ".join(f"{value:02x}" for value in table),
              ]
          except Exception as exc:
              table_text = [f"Could not decode R24 jump table JSON: {exc}", Path("/tmp/r24-jump-table.json").read_text(errors="replace")]
          Path("mach-o-evidence/r24-enum-jump-table.txt").write_text("\n".join(table_text) + "\n")

          # IMUPacketParsingError enum switch: the error enum discriminator is read from [x20,#0x29]. This is NOT the wire packet's type byte.
          try:
              imu_raw = json.loads(Path("/tmp/imu-packet-jump-table.json").read_text())
              if isinstance(imu_raw, dict):
                  imu_table = imu_raw.get("bytes", imu_raw.get("data", []))
              else:
                  imu_table = imu_raw
              imu_table = [int(value) for value in imu_table if isinstance(value, (int, float))]
              imu_text = [
                  "# WHOOP IMUPacketParsingError enum jump table at 0x108add8f0",
                  "Error enum discriminator is read from [error,#0x29] and indexes 16-bit relative branch entries; this is not the R24 wire-payload schema.",
                  f"Bytes recovered: {len(imu_table)}",
                  "Table hex: " + " ".join(f"{value:02x}" for value in imu_table),
              ]
          except Exception as exc:
              imu_text = [f"Could not decode IMUPacket jump table JSON: {exc}", Path("/tmp/imu-packet-jump-table.json").read_text(errors="replace")]
          Path("mach-o-evidence/imu-packet-jump-table.txt").write_text("\n".join(imu_text) + "\n")

          # Historical packet enum: switch input byte indexes this table. The
          # R24 branch is 0x105ce8038 relative to branch base 0x105ce7ff8,
          # i.e. a byte offset of 16 in the one-byte relative jump table.
          try:
              historical_raw = json.loads(Path("/tmp/historical-r24-jump-table.json").read_text())
              if isinstance(historical_raw, dict):
                  historical_table = historical_raw.get("bytes", historical_raw.get("data", []))
              else:
                  historical_table = historical_raw
              historical_table = [int(value) for value in historical_table if isinstance(value, (int, float))]
              historical_indexes = [i for i, value in enumerate(historical_table) if value == 16]
              historical_text = [
                  "# WHOOP historical packet enum switch table at 0x108ebdb70",
                  f"Bytes recovered: {len(historical_table)}",
                  "Observed R24 branch delta: (0x105ce8038 - 0x105ce7ff8) / 4 = 16",
                  "Input-byte indexes selecting the R24 branch: " + (", ".join(map(str, historical_indexes)) if historical_indexes else "none found"),
                  "Table hex: " + " ".join(f"{value:02x}" for value in historical_table),
              ]
          except Exception as exc:
              historical_text = [f"Could not decode historical R24 jump table JSON: {exc}", Path("/tmp/historical-r24-jump-table.json").read_text(errors="replace")]
          Path("mach-o-evidence/historical-r24-packet-jump-table.txt").write_text("\n".join(historical_text) + "\n")
          print(f"Selected strings: {len(hits)}; direct ARM64 references: {len(refs)}; disassembly lines: {len(lines)}")
          PY
          echo "R24 string references and switch-table bytes are static evidence only; they do not prove runtime BLE behaviour." >> mach-o-evidence/README.txt

      - name: Extract exact step sample model callee and state accessors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          lines = Path("/tmp/whoop-disassembly.txt").read_text(errors="replace").splitlines()
          targets = {
              "step-sample-model-callee-0x10036e4a4.txt": "10036e4a4",
              "step-sample-field-parser-0x10030b8c0.txt": "10030b8c0",
              "step-sample-next-parser-0x10036e5a4.txt": "10036e5a4",
              "step-sample-ingestion-callsite-0x10036dcb4.txt": "10036dcb4",
              "imu-packet-parser-0x10088e4ec.txt": "10088e4ec",
              "processed-steps-data-factory-0x1008026fc.txt": "1008026fc",
              "step-count-state-accessors.txt": None,
          }
          for filename, target in targets.items():
              if target:
                  matches = [i for i, line in enumerate(lines) if target in line.lower()]
                  out = ["# Exact disassembly target: 0x" + target, "Matching lines: " + str(len(matches))]
                  for i in matches[:20]:
                      window_end = i + (2400 if target == "10036e5a4" else 260)
                      out += ["", "--- context around line " + str(i+1) + " ---"] + lines[max(0,i-80):min(len(lines),window_end)]
              else:
                  terms = ("currentStepCount", "lastStepCount", "previousStepCount", "delayedStepCountProcessingWorkItem")
                  hits = [i for i,line in enumerate(lines) if any(term.lower() in line.lower() for term in terms)]
                  out = ["# Disassembly references to step-count state accessors", "Matching instruction/string lines: " + str(len(hits))]
                  for i in hits:
                      out += ["", "--- context around line " + str(i+1) + " ---"] + lines[max(0,i-45):min(len(lines),i+90)]
              Path("mach-o-evidence/" + filename).write_text(chr(10).join(out) + chr(10))
          PY
          echo "Added exact callee and step-state accessor disassembly windows; interpretation remains static until matched to captured runtime payloads." >> mach-o-evidence/README.txt

      - name: Resolve WHOOP R24 factory callers and parser cross-references
        shell: bash
        run: |
          set -euo pipefail
          # Run whole-binary analysis once, then resolve all targets in the same
          # radare2 session. Repeating "aa" for each target needlessly rescans
          # the full Mach-O and can keep this job busy for a long time.
          r2 -q -c 'aa; ?e BEGIN_R24_FACTORY_XREF; axtj @ 0x1008026fc; ?e BEGIN_PROCESSED_STEPS_XREF; axtj @ 0x1090d5e10; ?e BEGIN_HISTORICAL_R24_XREF; axtj @ 0x109218970; ?e BEGIN_R24_FACTORY_FUNCTION; afij @ 0x1008026fc; pdf @ 0x1008026fc; ?e BEGIN_IMU_ERROR_FUNCTION; afij @ 0x10088e4ec; pdf @ 0x10088e4ec' /tmp/whoop-arm64 > /tmp/r24-r2-session.txt 2>mach-o-evidence/radare2-crossrefs-errors.txt || true
          python3 - <<'PY'
          from pathlib import Path
          text = Path("/tmp/r24-r2-session.txt").read_text(errors="replace")
          markers = [
              ("r24-factory-xrefs.json", "BEGIN_R24_FACTORY_XREF", "BEGIN_PROCESSED_STEPS_XREF"),
              ("processed-steps-string-xrefs.json", "BEGIN_PROCESSED_STEPS_XREF", "BEGIN_HISTORICAL_R24_XREF"),
              ("historical-r24-string-xrefs.json", "BEGIN_HISTORICAL_R24_XREF", "BEGIN_R24_FACTORY_FUNCTION"),
              ("r24-factory-function.txt", "BEGIN_R24_FACTORY_FUNCTION", "BEGIN_IMU_ERROR_FUNCTION"),
              ("imu-error-function.txt", "BEGIN_IMU_ERROR_FUNCTION", None),
          ]
          for filename, start, end in markers:
              i = text.find(start)
              j = text.find(end, i + len(start)) if end else -1
              chunk = text[i + len(start):j if j >= 0 else None] if i >= 0 else ""
              Path("mach-o-evidence/" + filename).write_text(chunk.strip() + "\\n")
          PY
          echo "Cross-reference analysis is static; verify any candidate parser against captured BLE frames before decoding steps." >> mach-o-evidence/README.txt

      - name: Upload Mach-O evidence
        uses: actions/upload-artifact@v4
        with:
          name: whoop-ipa-mach-o-protocol-audit
          path: mach-o-evidence/
          retention-days: 14
