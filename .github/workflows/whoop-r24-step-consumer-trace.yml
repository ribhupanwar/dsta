name: WHOOP R24 step consumer trace
on:
  push:
    branches: [audit/whoop-r24-step-consumer-trace]
    paths:
      - ".github/workflows/whoop-r24-step-consumer-trace.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Download and verify pinned WHOOP 5.75.0 IPA
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://github.com/ribhupanwar/dsta/releases/download/whoop-5.75.0/pulseforge.ipa" -o /tmp/whoop-original.ipa
          echo "IPA SHA-256: $(shasum -a 256 /tmp/whoop-original.ipa | awk '{print $1}')"
          test "$(shasum -a 256 /tmp/whoop-original.ipa | awk '{print $1}')" = "8a5deedc59567612683feb77dd7348238de89437123946b3344bc6ff1e90af8a"
          unzip -tq /tmp/whoop-original.ipa
          mkdir -p r24-step-trace
          unzip -q /tmp/whoop-original.ipa -d /tmp/whoop-ipa
          APP_INFO="$(find /tmp/whoop-ipa/Payload -maxdepth 2 -name Info.plist -print -quit)"
          APP_DIR="$(dirname "$APP_INFO")"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_INFO")"
          BIN="$APP_DIR/$EXECUTABLE"
          if [[ "$(lipo -archs "$BIN")" == "arm64" ]]; then cp "$BIN" /tmp/whoop-arm64; else lipo "$BIN" -thin arm64 -output /tmp/whoop-arm64; fi
          echo "Binary SHA-256: $(shasum -a 256 /tmp/whoop-arm64 | awk '{print $1}')"
      - name: Generate full ARM64 disassembly and R24 / step-state xrefs
        shell: bash
        run: |
          set -euo pipefail
          otool -arch arm64 -tvV /tmp/whoop-arm64 > /tmp/whoop-full-disassembly.txt
          cp /tmp/whoop-full-disassembly.txt r24-step-trace/full-arm64-disassembly.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines = Path("/tmp/whoop-full-disassembly.txt").read_text(errors="replace").splitlines()
          terms = re.compile(r"Historical Processed Steps Packet \(R24\)|Processed Steps Data \(R24\)|R24q|currentStepCount|previousStepCount|lastStepCount|delayedStepCountProcessingWorkItem|HealthKitStepCountRequest|HealthKitStepCountSubmissionDTO|step_count_samples|deleted_step_count_samples|IMUPacket|RealtimeIMUData", re.I)
          addr_re = re.compile(r"^\s*([0-9a-f]{16})\s+")
          adrp_re = re.compile(r"^\s*([0-9a-f]{16})\s+adrp\s+(x\d+),.*?;\s*0x([0-9a-f]+)", re.I)
          add_re = re.compile(r"^\s*([0-9a-f]{16})\s+add\s+(x\d+),\s*(x\d+),\s*#0x([0-9a-f]+)", re.I)
          bl_re = re.compile(r"\bbl\s+0x([0-9a-f]+)", re.I)
          hits = [i for i, line in enumerate(lines) if terms.search(line)]
          # Recover exact direct ADRP+ADD xrefs to named step/R24 strings.
          string_addrs = {}
          for i in hits:
              m = re.search(r";\s*0x([0-9a-f]+)", lines[i])
              if m:
                  string_addrs[int(m.group(1),16)] = lines[i].split("literal pool for:")[-1].strip() if "literal pool for:" in lines[i] else lines[i].strip()
          refs = []
          for i,line in enumerate(lines):
              m=adrp_re.match(line)
              if not m: continue
              reg=m.group(2); page=int(m.group(3),16)
              for j in range(i+1,min(i+10,len(lines))):
                  a=add_re.match(lines[j])
                  if a and a.group(2)==reg and a.group(3)==reg:
                      target=page+int(a.group(4),16)
                      if target in string_addrs:
                          refs.append((i,j,target,string_addrs[target]))
          out=["# WHOOP R24 / step consumer trace","",f"Full disassembly lines: {len(lines)}",f"String-context hits: {len(hits)}",f"Direct ADRP+ADD references: {len(refs)}",""]
          for i,j,target,name in refs:
              out += [f"## String xref 0x{target:x}: {name}",lines[i].strip(),lines[j].strip()]
          Path("r24-step-trace/string-xrefs.txt").write_text("\n".join(out)+"\n")
          # Capture call sites to all known selector blocks and the containing
          # function neighbourhood, plus every step-state reference neighbourhood.
          targets={0x100802720,0x105ce7fdc,0x105ce8038,0x100802748}
          call_sites=[]
          for i,line in enumerate(lines):
              for m in bl_re.finditer(line):
                  target=int(m.group(1),16)
                  if target in targets: call_sites.append((i,target))
          selected=set()
          for i in hits:
              selected.update(range(max(0,i-100),min(len(lines),i+180)))
          for i,target in call_sites:
              selected.update(range(max(0,i-220),min(len(lines),i+260)))
          context=["# Step/R24 context and direct selector call-sites","", "Selector call-sites (exact target matches):"]
          context += [f"{lines[i].strip()} -> 0x{target:x}" for i,target in call_sites] or ["No direct BL to the interior selector addresses; callers may target an enclosing function entry or use indirect dispatch."]
          context += ["","## Expanded disassembly context"]
          prev=-2
          for i in sorted(selected):
              if i != prev+1: context.append("\n--- context window ---")
              context.append(lines[i]); prev=i
          Path("r24-step-trace/step-r24-context.txt").write_text("\n".join(context)+"\n")
          print("\n".join(out[:12]))
          print(f"Call-site matches: {len(call_sites)}; context lines: {len(selected)}")
          PY
      - name: Upload non-duplicative R24 trace evidence
        uses: actions/upload-artifact@v4
        with:
          name: whoop-r24-step-consumer-trace
          path: r24-step-trace/
          retention-days: 14
