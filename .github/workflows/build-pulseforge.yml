name: Build PulseForge iOS

on:
  push:
    branches: [whoop-native, whoop-background-ble]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned iPhone app
        run: |
          xcodebuild -project PulseForge.xcodeproj -scheme PulseForge -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Configure Bluetooth central background mode
        run: |
          APP_INFO_PLIST="build/Build/Products/Release-iphoneos/PulseForge.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$APP_INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string bluetooth-central" "$APP_INFO_PLIST"
          plutil -lint "$APP_INFO_PLIST"
      - name: Package unsigned IPA
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/PulseForge.app package/Payload/
          cd package
          zip -qry ../PulseForge-unsigned.ipa Payload
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseForge-unsigned-IPA
          path: PulseForge-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

# Rebuild trigger: preserve the existing unsigned IPA workflow configuration.
