name: Build PulseForge iOS

on:
  push:
    branches: [whoop-native, whoop-background-ble]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned iPhone app
        run: |
          xcodebuild -project PulseForge.xcodeproj -scheme PulseForge -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Configure and verify Bluetooth central background mode
        run: |
          APP_INFO_PLIST="build/Build/Products/Release-iphoneos/PulseForge.app/Info.plist"
          python3 - "$APP_INFO_PLIST" <<'PY'
          import plistlib
          import sys

          path = sys.argv[1]
          with open(path, "rb") as source:
              info = plistlib.load(source)
          modes = info.get("UIBackgroundModes", [])
          if isinstance(modes, str):
              modes = [modes]
          if "bluetooth-central" not in modes:
              modes.append("bluetooth-central")
          info["UIBackgroundModes"] = modes
          with open(path, "wb") as destination:
              plistlib.dump(info, destination)
          if "bluetooth-central" not in info["UIBackgroundModes"]:
              raise SystemExit("bluetooth-central background mode missing")
          PY
          plutil -lint "$APP_INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$APP_INFO_PLIST"
      - name: Package unsigned IPA
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/PulseForge.app package/Payload/
          cd package
          zip -qry ../PulseForge-unsigned.ipa Payload
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseForge-unsigned-IPA
          path: PulseForge-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
