name: PulseForge iOS Build

on:
  push:
    branches:
      - whoop-background-ble
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iPhone app
        run: |
          xcodebuild \
            -project PulseForge.xcodeproj \
            -scheme PulseForge \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="$(find ~/Library/Developer/Xcode/DerivedData -path '*/Build/Products/Release-iphoneos/PulseForge.app' -type d | head -n 1)"
          test -n "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr PulseForge-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseForge-unsigned-IPA
          path: PulseForge-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
